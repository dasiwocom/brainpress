# BrainPress Apache 站点配置（镜像生产 nginx 伪静态规则，见 website/vault/BrainPress/Deployment.md）
<VirtualHost *:80>
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        RewriteEngine On

        # 敏感文件一律 404（与 nginx 一致；含 vault 内同名文件）：
        #   .user.ini / config.json / .bak(up) / .log / .sql / README.md / composer.json / .env.*
        RewriteRule (\.user\.ini|config\.json|\.bak(up)?|\.log|\.sql|README\.md|composer\.json|\.env.*)$ - [R=404,L]

        # 后台入口：/admin 与 /api/admin/* → admin.php
        RewriteRule ^api/admin(/.*)?$ admin.php [L]
        RewriteRule ^admin(/.*)?$ admin.php [L]

        # 虚拟路由（与 nginx location 一致）：/api/*、/graph、/dav/* → index.php
        RewriteRule ^api(/.*)?$ index.php [L]
        RewriteRule ^graph(/.*)?$ index.php [L]
        RewriteRule ^dav(/.*)?$ index.php [L]

        # 内容渲染：/vault/ 前缀之外的 .md/.canvas/.pdf → index.php
        RewriteCond %{REQUEST_URI} !^/vault/
        RewriteRule \.(md|pdf|canvas)$ index.php [L]

        # vault 缺失文件兜底：主 vault 不存在时 → index.php 从自定义挂载目录流式输出；
        # 真实存在的文件不会命中下面的 !-f 条件，由 Apache 直接吐原始字节（图片/PDF 原件给 pdf.js）
        RewriteCond %{REQUEST_URI} ^/vault/
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [L]

        # 其余一切交给 index.php 路由（API、WebDAV、SSR 页面、内置 404）；
        # 真实存在的文件/目录（assets、index.php 等）原样直出
        RewriteCond %{REQUEST_URI} !^/vault/
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.php [L]
    </Directory>
</VirtualHost>